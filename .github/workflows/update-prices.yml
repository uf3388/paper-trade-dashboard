name: 更新即時報價
on:
  schedule:
    # 交易日 09:00-13:35，每 5 分鐘（UTC 01:00-05:35）
    - cron: '*/5 1-5 * * 1-5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 更新報價
        run: |
          python3 << 'PYEOF'
          import json, urllib.request
          with open('dashboard.json') as f:
              d = json.load(f)
          for p in d.get('positions', []):
              sid = p['sid']
              px = None
              for sfx in ['.TWO', '.TW']:
                  try:
                      url = f'https://query1.finance.yahoo.com/v8/finance/chart/{sid}{sfx}?interval=1d&range=1d'
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                      with urllib.request.urlopen(req, timeout=10) as r:
                          m = json.load(r)['chart']['result'][0]['meta']
                          if m.get('regularMarketPrice'):
                              px = m['regularMarketPrice']
                              break
                  except: continue
              if px:
                  p['current_price'] = round(px, 2)
                  p['market_value'] = int(px * p['shares'])
                  p['unrealized_pnl'] = int((px - p['buy_price']) * p['shares'])
                  p['unrealized_pct'] = round((px - p['buy_price']) / p['buy_price'] * 100, 2)
          # 更新 live 區
          pv = sum(p.get('market_value', 0) for p in d.get('positions', []))
          cash = d.get('live', {}).get('cash', 200000)
          d['live'] = {'cash': cash, 'position_value': pv, 'total': cash + pv,
                       'pnl': cash + pv - 200000,
                       'pnl_pct': round((cash + pv - 200000) / 200000 * 100, 2)}
          from datetime import datetime, timezone, timedelta
          tpe = timezone(timedelta(hours=8))
          d['meta']['updated_at'] = datetime.now(tpe).strftime('%Y-%m-%d %H:%M')
          with open('dashboard.json', 'w') as f:
              json.dump(d, f, ensure_ascii=False)
          print('報價已更新')
          PYEOF
      - name: 提交
        run: |
          git config user.name "dashboard-bot"
          git config user.email "bot@example.com"
          git add dashboard.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "即時報價更新" && git push)
